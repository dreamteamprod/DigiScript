version: 2
# Version updates are grouped per ecosystem/directory so each one produces a single
# PR (and a single CI run) instead of one PR per dependency. `dev` requires branches
# to be up to date before merging, so N separate PRs means N serial rebase + full-CI
# cycles. Security updates are not affected: they are opened separately and immediately.
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "daily"
    ignore:
      # Pinned to Vue 2.x - upgrading to Vue 3 requires a full application rewrite.
      # versions condition applies to both version updates AND security updates,
      # unlike update-types which only applies to version updates.
      - dependency-name: "vue"
        versions: [">=3.0.0"]
      - dependency-name: "vue-router"
        versions: [">=4.0.0"]
      - dependency-name: "vuex"
        versions: [">=5.0.0"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      client-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    versioning-strategy: increase
    target-branch: dev
  - package-ecosystem: "npm"
    directory: "/client-v3"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      client-v3-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    versioning-strategy: increase
    target-branch: dev
  - package-ecosystem: "npm"
    directory: "/electron"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      electron-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    versioning-strategy: increase
    target-branch: dev
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      server-pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    versioning-strategy: increase
    target-branch: dev
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    target-branch: dev
  - package-ecosystem: "github-actions"
    directory: "/.github"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    target-branch: dev
