name: Lint & Format (ESLint + Prettier)
permissions:
  contents: read

on: [push]

jobs:
  run-node-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: 'client/pnpm-lock.yaml'
    - run: pnpm install --frozen-lockfile
    - run: pnpm run ci-lint
  run-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: 'client/pnpm-lock.yaml'
    - run: pnpm install --frozen-lockfile
    - run: pnpm run typecheck
  run-node-lint-client-v3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-v3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'client-v3/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci-lint
  run-typecheck-client-v3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-v3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'client-v3/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
