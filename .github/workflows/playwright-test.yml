name: Playwright E2E Tests

on: [pull_request]

permissions:
  checks: write
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    name: E2E Tests (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: ./server

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: client-v3/package.json

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'client-v3/pnpm-lock.yaml'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./client-v3

      - name: Build Vue 3 frontend
        run: pnpm run build
        working-directory: ./client-v3

      - name: Install Playwright browser
        # matrix.browser is a static value from the matrix definition (chromium/firefox)
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: ./client-v3

      - name: Run Playwright tests
        # matrix.browser is a static value from the matrix definition (chromium/firefox)
        run: pnpm exec playwright test --project=${{ matrix.browser }}
        working-directory: ./client-v3

      # Retries mean a test that fails then passes shows up in the run as
      # "flaky", not "failed" — junit/exit-code treat it as a pass, so it's
      # easy to miss. This reads the json reporter output (client-v3/playwright.config.ts,
      # CI-only) and lists any flaky tests in the job summary. Best-effort:
      # guarded with `if: always()` and never fails the job.
      - name: Summarize flaky tests
        if: always()
        working-directory: ./client-v3
        run: |
          set +e
          REPORT="playwright-report/results.json"
          {
            echo "### Flaky tests — ${{ matrix.browser }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$REPORT" ]; then
            echo "_No JSON report found (run may not have completed); skipping._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FLAKY=$(jq -r '
            [.. | objects | select(has("tests") and has("ok"))
              | . as $spec
              | $spec.tests[]
              | select(.status == "flaky")
              | "| \($spec.file):\($spec.line) | \($spec.title) | \(.projectName) | \(.results | length) |"
            ] | join("\n")
          ' "$REPORT")
          JQ_STATUS=$?
          if [ "$JQ_STATUS" -ne 0 ]; then
            echo "_Could not parse $REPORT (jq exited $JQ_STATUS) — unable to determine flaky status for this run._" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$FLAKY" ]; then
            echo "None." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "A test that fails at least once but eventually passes on retry still counts as a pass overall — see [issue #1415](https://github.com/dreamteamprod/DigiScript/issues/1415)."
              echo ""
              echo "| Spec | Test | Project | Attempts |"
              echo "|---|---|---|---|"
              echo "$FLAKY"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: client-v3/playwright-report/
          retention-days: 7

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "Playwright E2E Results (${{ matrix.browser }})"
          junit_files: "**/client-v3/junit/playwright-results.xml"
