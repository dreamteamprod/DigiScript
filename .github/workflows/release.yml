name: Create Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## DigiScript Release ${{ github.ref_name }}

            This release includes the DigiScript server application, with the web client bundled.

            ### Server Application
            - **Linux**: Download `DigiScript-linux.zip`
            - **Windows**: Download `DigiScript-windows.zip`
            - **macOS**: Download `DigiScript-macos.zip`

            ---

            See below for detailed release notes.
