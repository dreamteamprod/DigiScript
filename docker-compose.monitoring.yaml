# Optional Prometheus + Grafana monitoring overlay for DigiScript.
#
#   export GF_SECURITY_ADMIN_PASSWORD='choose-a-strong-password'
#   docker compose -f docker-compose.yaml -f docker-compose.monitoring.yaml up -d
#
# Published ports are bound to 127.0.0.1 only. To expose them on other
# interfaces set PROMETHEUS_BIND / GRAFANA_BIND (e.g. GRAFANA_BIND=0.0.0.0),
# and put a reverse proxy with TLS/auth in front of them.
#
# The scrape path / auth for the DigiScript metrics endpoint lives in ONE place:
# monitoring/prometheus/prometheus.yml
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - server

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD to a strong Grafana admin password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
