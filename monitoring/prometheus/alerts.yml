groups:
  - name: digiscript
    rules:
      - alert: DigiScriptDown
        expr: up{job="digiscript"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DigiScript server is not being scraped successfully
      - alert: DigiScriptHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(tornado_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 HTTP request latency above 1s for 5m
      - alert: DigiScriptHigh5xxRate
        expr: sum(rate(tornado_http_requests_total{status=~"5.."}[5m])) / sum(rate(tornado_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of HTTP requests are returning 5xx
      - alert: DigiScriptUnhandledErrors
        expr: increase(digiscript_unhandled_errors_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Unhandled errors raised in the last 5m
      - alert: DigiScriptAuthFailureSpike
        expr: sum(increase(digiscript_auth_events_total{result="failure"}[5m])) > 20
        labels:
          severity: warning
        annotations:
          summary: More than 20 failed auth events in 5m
