global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: digiscript
    # Scrape path and any auth for the DigiScript metrics endpoint: change here only.
    # Currently unauthenticated; if it is gated later add e.g.
    #   authorization: { credentials_file: /etc/prometheus/token }
    metrics_path: /debug/metrics
    static_configs:
      - targets: ["server:8080"]
